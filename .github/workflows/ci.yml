name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build -warnaserror

      - name: Test
        run: dotnet test

      - name: Build private variant
        run: dotnet build src/DLSSUpdater -warnaserror -p:LecramChannel=true

      - name: Release bot tests
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 5.0
          $c = New-PesterConfiguration; $c.Run.Path = 'tools/release-bot'; $c.Run.Exit = $true; $c.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $c
