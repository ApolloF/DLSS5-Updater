name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build -warnaserror

      - name: Format
        run: dotnet format --verify-no-changes --no-restore

      - name: Vulnerable packages
        shell: pwsh
        run: |
          # dotnet list package exits 0 even when it finds something, so the output decides.
          $out = dotnet list package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw "dotnet list package failed" }
          if ($out -match 'following vulnerable packages' -or $out -notmatch 'no vulnerable packages') { throw "vulnerable packages found" }

      - name: Test
        run: dotnet test

      - name: Build private variant
        run: dotnet build src/DLSSUpdater -warnaserror -p:LecramChannel=true
