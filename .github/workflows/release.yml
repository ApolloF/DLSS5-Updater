name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = ([xml](Get-Content src/DLSSUpdater/DLSSUpdater.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$v") { throw "Tag $env:GITHUB_REF_NAME doesn't match csproj version $v" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test -c Release

      - name: Publish
        run: dotnet publish src/DLSSUpdater -c Release -p:LecramChannel=false -o publish

      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" installer\DLSSUpdater.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Checksums
        shell: pwsh
        run: |
          # The app's self-update refuses any download that isn't listed here with the right hash (Core/AppUpdate.cs).
          $files = "DLSS5Updater.exe", "DLSS5Updater-Setup-${{ steps.version.outputs.version }}.exe"
          $lines = foreach ($f in $files) {
            $p = Join-Path publish $f
            if (-not (Test-Path $p)) { throw "$f missing" }
            "$((Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant())  $f"
          }
          [IO.File]::WriteAllText((Join-Path publish SHA256SUMS), ($lines -join "`n") + "`n")
          Get-Content publish/SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: DLSS5Updater
          path: |
            publish/DLSS5Updater.exe
            publish/DLSS5Updater-Setup-*.exe
            publish/SHA256SUMS

      - name: Release notes
        id: notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # docs/releases/v<version>.md becomes the release text when it exists.
          $f = "docs/releases/v${{ steps.version.outputs.version }}.md"
          "path=$(if (Test-Path $f) { $f } else { '' })" >> $env:GITHUB_OUTPUT
          # The release bot tags with an annotated "release-bot prerelease" message: those start as a prerelease (the
          # app's self-update skips them) and the bot promotes them after 24 hours. Every other tag is a normal release.
          $t = $env:GITHUB_REF_NAME
          git fetch --no-tags --depth=1 origin "+refs/tags/${t}:refs/tags/${t}"
          if ($LASTEXITCODE -ne 0) { throw "cannot read tag $t" }
          $kind = git for-each-ref "refs/tags/$t" --format='%(objecttype)'
          $subject = git for-each-ref "refs/tags/$t" --format='%(contents:subject)'
          $pre = $kind -eq 'tag' -and $subject -like 'release-bot prerelease*'
          # A re-run keeps the prerelease state the release already has, whoever set it (the bot's promotion, or the
          # owner holding any tag back as a prerelease).
          $existing = gh release view $t --json isPrerelease 2>$null
          if ($LASTEXITCODE -eq 0) { $pre = [bool]($existing | ConvertFrom-Json).isPrerelease }
          $global:LASTEXITCODE = 0  # no release yet is the normal case, not a failed step
          "prerelease=$(if ($pre) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ steps.notes.outputs.prerelease == 'true' }}
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            publish/DLSS5Updater.exe
            publish/DLSS5Updater-Setup-*.exe
            publish/SHA256SUMS
